name: Atualizar perfil

"on":
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r scripts/requirements.txt
      - name: Gerar painéis com dados reais
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/update_profile.py
      - name: Salvar atualização
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/heatmap.svg assets/stats.svg data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualizar estatísticas do perfil'
            git push
          fi
